<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111c16">
<title>Fairway – Golf-Karriere</title>
<meta name="description" content="Fairway – Golf-Karriere: Touren, Matchplay-Cup, Challenges. Zielen, Linie stoppen, Kraft stoppen.">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-title" content="Fairway">
<style>
:root{--bg:#f2f0e8;--ink:#1f2a22;--soft:#7b8378;--card:#fff;--acc:#2f7d4f;--warn:#c8643b;--gold:#d9a521;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;pointer-events:none}
.hrow{display:flex;gap:8px;align-items:stretch}.hrow.r{justify-content:flex-end;margin-top:8px}
.pill{pointer-events:auto;background:rgba(17,28,22,.82);color:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.ib{width:42px;height:42px;display:grid;place-items:center;font-size:17px;font-weight:800}
#info{flex:1;padding:7px 12px;min-width:0}
#info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info span{display:block;font-size:12.5px;color:rgba(255,255,255,.62);font-weight:700;margin-top:1px;white-space:nowrap}
#wind{height:42px;padding:0 12px;display:flex;align-items:center;gap:6px}
#wind i{display:block;width:18px;height:18px;transition:transform .4s}
#wind span{font-size:13px;font-weight:800}
#score{padding:6px 10px;text-align:center;min-width:52px}
#score b{display:block;font-size:20px;font-weight:900;line-height:1.05}
#score span{font-size:10px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.5px}
#score b{color:#9be07a}

/* Panel */
#panel{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(var(--sb) + 12px);pointer-events:none}
#panel>*{pointer-events:auto}
.pcard{background:rgba(17,28,22,.9);color:#fff;border-radius:22px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:460px;margin:0 auto;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arr{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:900}
#club{flex:1;text-align:center}
#club b{display:block;font-size:17px}
#club span{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.55)}
.segs{display:flex;gap:8px;margin-bottom:9px}
.seg{flex:1;display:flex;background:rgba(255,255,255,.07);border-radius:13px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.55)}
.seg button.on{background:#4fb576;color:#0f1a13}
.seg.lock{opacity:.45}
#swingBtn{display:block;width:100%;padding:15px;border-radius:15px;background:linear-gradient(180deg,#5cc685,#3a9a5f);color:#0b170f;font-size:17px;font-weight:900;letter-spacing:.3px;box-shadow:0 3px 0 #23673d}
#swingBtn:active{transform:scale(.98)}
#puttCard{text-align:center;font-weight:800;color:var(--soft);font-size:14px;padding:12px}
#puttCard button{margin-top:8px;padding:9px 16px;border-radius:11px;background:#eef0ea;color:var(--ink);font-weight:800;font-size:13px}

#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.85);background:rgba(17,28,22,.88);border:1px solid rgba(255,255,255,.1);color:#fff;
  font-weight:900;font-size:22px;padding:11px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:13px;font-weight:700;opacity:.8;text-align:center}

/* Screens – dunkles Sport-Design */
.screen{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 24px);touch-action:pan-y;
  --ink:#eef3ec;--soft:#8fa294;--card:#1c2b22;--line:#2a3d31;background:radial-gradient(120% 60% at 50% 0%,#1f3a2a 0%,#111c16 60%);color:var(--ink)}
.wrap{max-width:460px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{flex:1;margin:0;font-size:22px;font-weight:900}
.screen .pill{background:#24362b;color:var(--ink);box-shadow:none}
.coins{font-weight:900;background:#24362b;color:#f2c14e;border-radius:20px;padding:8px 13px;font-size:14px;white-space:nowrap}
.logo{font-size:24px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo svg{width:34px;height:34px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.prof{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#4fb576,#2f7d4f);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.prof .tx{flex:1;min-width:0}.prof b{font-size:18px}.prof span{display:block;color:var(--soft);font-size:13px;font-weight:700;margin-top:2px}
.prof small{display:block;color:var(--soft);font-size:12px;font-weight:700;margin-top:5px}
.spn{color:#f2c14e}
.xpb{height:7px;border-radius:4px;background:#2a3d31;margin-top:8px;overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,#4fb576,#9be07a);border-radius:4px}
.hero{background:linear-gradient(135deg,#2f7d4f 0%,#1f5a39 100%);border:0;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:rgba(255,255,255,.07);transform:rotate(30deg);border-radius:22px}
.hero .k{opacity:.8;font-weight:800;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.hero .t{font-size:26px;font-weight:900;margin:4px 0 4px}
.hero .s{font-weight:700;opacity:.9;margin-bottom:14px;font-size:13.5px}
.btn{display:block;width:100%;padding:14px;border-radius:15px;font-weight:900;font-size:16px;background:linear-gradient(180deg,#5cc685,#3a9a5f);color:#0b170f;text-align:center;box-shadow:0 3px 0 #23673d}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.btn.w{background:#fff;color:#1f2a22}
.btn.g{background:rgba(255,255,255,.09);color:#eef3ec;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{margin:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:14px}
.tile span{font-size:24px;margin-bottom:4px}.tile b{font-size:15.5px}.tile small{color:var(--soft);font-size:12px;font-weight:700}
.tile:active{transform:scale(.98)}
.tourh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 4px 8px}.tourh b{white-space:nowrap}.tourh span{text-align:right}
.tourh b{font-size:17px}.tourh span{color:var(--soft);font-size:12.5px;font-weight:700}
.tourh.lock{opacity:.6}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px}
.ev .no{width:42px;height:42px;border-radius:12px;background:#24362b;display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.ev .tx{flex:1;min-width:0}.ev .tx b{display:block;font-size:15px}.ev .tx span{font-size:12px;color:var(--soft);font-weight:700}
.ev.lock{opacity:.4}
.gear .no{font-size:10px;color:#f2c14e;letter-spacing:-1px}
.gear.eq{border-color:#4fb576}
.sbtn{padding:9px 13px;border-radius:12px;font-weight:900;font-size:13px;background:#4fb576;color:#0f1a13;white-space:nowrap}
.sbtn.dis{background:#2a3d31;color:#6c7f71}
.sbtn.on{background:transparent;color:#4fb576;border:1.5px solid #4fb576}
.sk{display:flex;gap:12px;align-items:center}
.sk .ic{width:46px;height:46px;border-radius:14px;background:#24362b;display:grid;place-items:center;font-size:22px;flex:none}
.sk .tx{flex:1}.skh{display:flex;justify-content:space-between}.skh b{font-size:16px}.skh em{font-style:normal;color:var(--soft);font-weight:800;font-size:13px}
.sk p{margin:3px 0 8px;color:var(--soft);font-size:12.5px;font-weight:600;line-height:1.35}
.dots{display:flex;gap:3px}.dots i{flex:1;height:6px;border-radius:3px;background:#2a3d31}.dots i.f{background:#4fb576}
.plus{width:44px;height:44px;border-radius:14px;background:#4fb576;color:#0f1a13;font-size:26px;font-weight:900;flex:none}
.plus.dis{background:#2a3d31;color:#6c7f71}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:900}.stat span{font-size:12px;color:var(--soft);font-weight:700}
.help{color:var(--soft);font-size:12.5px;font-weight:600;text-align:center;line-height:1.55}

/* Overlays */
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,15,8,.45);padding:0 12px calc(var(--sb) + 12px);z-index:5}
.ov .card{width:100%;max-width:460px;text-align:center;padding:22px 18px 18px;animation:up .35s cubic-bezier(.2,1.3,.4,1);max-height:88vh;overflow-y:auto;background:#17251d;color:#eef3ec;border-radius:24px;border:1px solid rgba(255,255,255,.08);--ink:#eef3ec;--soft:#8fa294;--acc:#5cc685;--warn:#ef8a5b}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.big{font-size:38px;font-weight:900;letter-spacing:-1px}
.sub{color:var(--soft);font-weight:700;margin:3px 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.chip{display:inline-block;background:rgba(242,193,78,.15);color:#f2c14e;font-weight:900;border-radius:12px;padding:7px 12px}
.chip.xp{background:rgba(92,198,133,.15);color:#9be07a}.chip.lv{background:#2f7d4f;color:#fff}
table.lb{width:100%;border-collapse:collapse;margin:2px 0 14px;font-size:14px;font-weight:800}
table.lb td{padding:7px 6px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
table.lb td:first-child{width:38px;color:var(--soft)}table.lb td:last-child{text-align:right;width:44px}
table.lb tr.me td{background:rgba(92,198,133,.18);color:#9be07a}table.lb tr.me td:first-child{border-radius:8px 0 0 8px}table.lb tr.me td:last-child{border-radius:0 8px 8px 0}
.lbh{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;text-align:left;margin-bottom:2px}
.btns{display:flex;flex-direction:column;gap:9px}
table.sc{width:100%;border-collapse:collapse;margin:4px 0 14px;font-size:13px;font-weight:800}
table.sc td{padding:6px 0;text-align:center;border-bottom:1px solid rgba(255,255,255,.07)}
table.sc td:first-child{text-align:left;color:var(--soft);font-weight:700;width:46px}
.sq{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px}
.s-e{background:#3d82d6;color:#fff}.s-b{background:#3a9a5f;color:#fff}.s-p{background:rgba(255,255,255,.08)}.s-o{background:#8a5a3c;color:#fff}.s-d{background:#c8643b;color:#fff}

/* ---------- Animationen ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen.enter .wrap>*{animation:fadeUp .45s cubic-bezier(.2,.9,.3,1) both}
.screen.enter .wrap>*:nth-child(2){animation-delay:.04s}.screen.enter .wrap>*:nth-child(3){animation-delay:.08s}.screen.enter .wrap>*:nth-child(4){animation-delay:.12s}
.screen.enter .wrap>*:nth-child(5){animation-delay:.16s}.screen.enter .wrap>*:nth-child(6){animation-delay:.2s}.screen.enter .wrap>*:nth-child(7){animation-delay:.24s}
.screen.enter .wrap>*:nth-child(8){animation-delay:.28s}.screen.enter .wrap>*:nth-child(n+9){animation-delay:.32s}
button{transition:transform .12s ease,filter .12s ease}
button:active{transform:scale(.96)}
.card.tile:active,.card.wide:active{filter:brightness(1.15)}
#score.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
#intro{position:fixed;left:0;right:0;top:36%;text-align:center;pointer-events:none;color:#fff;opacity:0;z-index:4}
#intro b{display:block;font-size:46px;font-weight:900;letter-spacing:-1px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
#intro span{display:inline-block;margin-top:6px;background:rgba(17,28,22,.85);border-radius:20px;padding:6px 14px;font-weight:800;font-size:15px}
#intro small{display:block;margin-top:8px;font-weight:700;font-size:13px;opacity:.9;text-shadow:0 2px 10px rgba(0,0,0,.4)}
#intro.show{animation:introA 2.3s cubic-bezier(.2,.9,.3,1) both}
@keyframes introA{0%{opacity:0;transform:translateY(20px) scale(.9)}12%{opacity:1;transform:none}78%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#confetti i{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.pcard{animation:fadeUp .3s both}
/* ---------- Home ---------- */
.sech{font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:1px;margin:18px 4px 9px}
.tile{position:relative;overflow:hidden}
.tile.t1{background:linear-gradient(150deg,#26422f,#1c2b22)}.tile.t2{background:linear-gradient(150deg,#3a2f22,#1c2b22)}
.tile.t3{background:linear-gradient(150deg,#22394a,#1c2b22)}.tile.t4{background:linear-gradient(150deg,#46282a,#1c2b22)}
.badge{position:absolute;top:10px;right:10px;background:#f2c14e;color:#1b1406;font-style:normal;font-weight:900;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;animation:pop 1.6s infinite}
.wide{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px}
.wide>span{font-size:24px}.wide div{flex:1}.wide b{display:block;font-size:15.5px}.wide small{color:var(--soft);font-size:12px;font-weight:700}.wide em{font-style:normal;color:var(--soft);font-size:22px;font-weight:800}
.ver{text-align:center;color:#4d6455;font-size:11px;font-weight:700;margin-top:4px}
/* ---------- Overlays: Challenges & Matchplay ---------- */
.medal{font-size:56px;line-height:1;margin:6px 0 2px;animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
.shots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:4px 0 10px}
.shots div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 2px}
.shots div.b{background:rgba(242,193,78,.18);box-shadow:inset 0 0 0 1.5px #f2c14e}
.shots small{display:block;font-size:10.5px;color:var(--soft);font-weight:800}.shots b{font-size:14px}
.hint2{font-size:12px;color:var(--soft);font-weight:700;margin-bottom:12px}
.vs{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.vs>div{flex:1;background:rgba(255,255,255,.06);border-radius:16px;padding:10px 6px}
.vs>div.w{background:rgba(92,198,133,.16);box-shadow:inset 0 0 0 1.5px #5cc685}
.vs small{display:block;font-size:12px;color:var(--soft);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vs b{display:block;font-size:34px;font-weight:900}.vs em{font-style:normal;font-size:12px;font-weight:700;color:var(--soft)}
.vs>span{font-size:11px;font-weight:900;color:var(--soft);text-transform:uppercase}
.mstat{font-weight:900;font-size:16px;margin-bottom:10px}
.mcard{display:flex;justify-content:center;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.mcard i{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:900;background:rgba(255,255,255,.08)}
.mcard i.w{background:#3a9a5f;color:#fff}.mcard i.l{background:#c8643b;color:#fff}
/* ---------- Turnierbaum ---------- */
.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.bcol{display:flex;flex-direction:column;justify-content:space-around;gap:8px}
.bcol h4{margin:0 0 2px;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.bm{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:12px;font-weight:800;position:relative}
.bm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.bm div.w{color:#9be07a}.bm div.l{color:#5f7566;text-decoration:line-through}
.bm small{display:block;text-align:right;font-size:9.5px;color:var(--soft);margin-top:1px}
.bm.mine{border-color:#4fb576;box-shadow:0 0 0 1px #4fb576}
.champ,.nextm{text-align:center}.champ b{display:block;font-size:18px}.champ span,.nextm .sk{color:var(--soft);font-size:13px;font-weight:700}
.nextm small{color:var(--soft);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.8px}
.vsr{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0}.vsr b{font-size:20px}.vsr span{color:#f2c14e;font-weight:900}

/* ---------- Statistik ---------- */
.prof{cursor:pointer}
.hcpb{order:3;text-align:center;background:rgba(92,198,133,.12);border:1px solid rgba(92,198,133,.35);border-radius:14px;padding:6px 10px;flex:none}
.hcpb small{display:block;font-size:10px;font-weight:900;color:#9be07a;letter-spacing:1px}.hcpb b{font-size:20px;font-weight:900}
.hcpc .hl{display:grid;grid-template-columns:auto 1fr;align-items:baseline;column-gap:10px}
.hcpc small{grid-column:1/3;font-size:12px;font-weight:800;color:var(--soft);text-transform:uppercase;letter-spacing:1px}
.hcpc b{font-size:52px;font-weight:900;letter-spacing:-1.5px;line-height:1.05}
.hcpc em{grid-column:1/3;font-style:normal;color:var(--soft);font-size:12.5px;font-weight:600;margin:2px 0 10px}
.dn{color:#9be07a;font-weight:900}.up{color:#ef8a5b;font-weight:900}
.spark{width:100%;height:90px;display:block}
.sline{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.4s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.spk{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);font-weight:700;margin-top:2px}
.nochart{font-size:12.5px;color:var(--soft);font-weight:700;text-align:center;padding:16px 0 4px;border-top:1px dashed var(--line)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px;text-align:center}
.sgrid b{display:block;font-size:19px;font-weight:900}.sgrid small{font-size:11.5px;color:var(--soft);font-weight:700}
.srow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}.card>.srow:first-child{padding-top:0}
.srow span{font-weight:700;font-size:14.5px}.srow small{display:block;font-size:11.5px;color:var(--soft);font-weight:600}
.srow b{font-size:17px;font-weight:900}
.dist{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.drow{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:12.5px;font-weight:800}
.drow span{color:var(--soft)}.drow b{text-align:right}
.dbar{height:10px;background:#24362b;border-radius:5px;overflow:hidden}.dbar i{display:block;height:100%;border-radius:5px;animation:grow 1s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.c-e{background:#3d82d6}.c-b{background:#3a9a5f}.c-p{background:#9aa89c}.c-o{background:#d29a5c}.c-d{background:#c8643b}
.rlist{padding:6px 14px}
.rr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rr:last-child{border-bottom:0}
.rr div{flex:1;min-width:0}.rr div b{display:block;font-size:14px}.rr div small{display:block;font-size:11px;color:var(--soft);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr>span{text-align:right;font-weight:900;font-size:16px}.rr>span small{display:block;font-size:11px;color:var(--soft)}
.rr.cnt>span small{color:#9be07a}
.rstat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 8px}
.rstat div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 2px}.rstat b{display:block;font-size:18px}.rstat small{font-size:11px;color:var(--soft);font-weight:800}
.hcpline{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:12px}.hcpline b{color:var(--ink)}
#rot{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;font-weight:800;font-size:18px;padding:30px;z-index:9}
@media (orientation:landscape) and (max-height:500px){#rot{display:grid}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hrow">
    <button class="pill ib" id="menuBtn" aria-label="Menü">✕</button>
    <div class="pill" id="info"><b id="hTitle"></b><span id="hSub"></span></div>
    <div class="pill" id="score"><b id="scoreT" class="num">E</b><span id="strokeT">SCHLAG 1</span></div>
  </div>
  <div class="hrow r">
    <div class="pill" id="wind"><i><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2 L18 14 L12 11 L6 14 Z" fill="#9be07a"/></svg></i><span id="windT"></span></div>
    <button class="pill ib" id="ovBtn" aria-label="Übersicht">⤢</button>
  </div>
</div>

<div id="panel" class="hidden">
  <div class="pcard" id="aimCard">
    <div class="crow"><button class="arr" id="cPrev">‹</button><div id="club"><b id="clubN"></b><span id="clubD"></span></div><button class="arr" id="cNext">›</button></div>
    <div class="segs">
      <div class="seg" id="shapeSeg"><button data-sh="-1">↰ Draw</button><button data-sh="0">Gerade</button><button data-sh="1">Fade ↱</button></div>
    </div>
    <div class="segs">
      <div class="seg" id="spinSeg"><button data-sp="-1">Backspin</button><button data-sp="0">Normal</button><button data-sp="1">Topspin</button></div>
    </div>
    <button id="swingBtn">Schlagen</button>
  </div>
  <div class="pcard hidden" id="puttCard"><div id="puttT">Zurückziehen und loslassen zum Putten</div><button id="chipBtn" class="hidden">Doch chippen</button></div>
</div>
<div id="toast"></div>
<div id="intro"></div>
<div id="confetti"></div>

<div id="home" class="screen"></div>
<div id="career" class="screen hidden"></div>
<div id="player" class="screen hidden"></div>
<div id="shop" class="screen hidden"></div>
<div id="cup" class="screen hidden"></div>
<div id="stats" class="screen hidden"></div>
<div id="ov" class="ov hidden"><div class="card" id="ovCard"></div></div>
<div id="rot">Bitte dreh dein Handy ins Hochformat 📱</div>

<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

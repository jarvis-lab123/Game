<style>
:root{--bg:#f2f0e8;--ink:#1f2a22;--soft:#7b8378;--card:#fff;--acc:#2f7d4f;--warn:#c8643b;--gold:#d9a521;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#111c16;color:var(--ink);
  font-family:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;top:0;left:0;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 10px) 12px 0;pointer-events:none}
.hrow{display:flex;gap:8px;align-items:stretch}.hrow.r{justify-content:flex-end;margin-top:8px}
.pill{pointer-events:auto;background:rgba(17,28,22,.82);color:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08)}
.ib{width:42px;height:42px;display:grid;place-items:center;font-size:17px;font-weight:800}
#info{flex:1;padding:7px 12px;min-width:0}
#info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info span{display:block;font-size:12.5px;color:rgba(255,255,255,.62);font-weight:700;margin-top:1px;white-space:nowrap}
#wind{height:42px;padding:0 12px;display:flex;align-items:center;gap:6px}
#wind i{display:block;width:18px;height:18px;transition:transform .4s}
#wind span{font-size:13px;font-weight:800}
#score{padding:6px 10px;text-align:center;min-width:52px}
#score b{display:block;font-size:20px;font-weight:900;line-height:1.05}
#score span{font-size:10px;font-weight:800;color:rgba(255,255,255,.55);letter-spacing:.5px}
#score b{color:#9be07a}

/* Panel */
#panel{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(var(--sb) + 12px);pointer-events:none}
#panel>*{pointer-events:auto}
.pcard{background:rgba(17,28,22,.9);color:#fff;border-radius:22px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:460px;margin:0 auto;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08)}
.crow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.arr{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.08);color:#fff;font-size:22px;font-weight:900}
#club{flex:1;text-align:center}
#club b{display:block;font-size:17px}
#club span{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.55)}
.segs{display:flex;gap:8px;margin-bottom:9px}
.seg{flex:1;display:flex;background:rgba(255,255,255,.07);border-radius:13px;padding:3px}
.seg button{flex:1;padding:8px 0;border-radius:10px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.55)}
.seg button.on{background:#4fb576;color:#0f1a13}
.seg.lock{opacity:.45}
#swingBtn{display:block;width:100%;padding:15px;border-radius:15px;background:linear-gradient(180deg,#5cc685,#3a9a5f);color:#0b170f;font-size:17px;font-weight:900;letter-spacing:.3px;box-shadow:0 3px 0 #23673d}
#swingBtn:active{transform:scale(.98)}
#puttCard{text-align:center;font-weight:800;color:var(--soft);font-size:14px;padding:12px}
#puttCard button{margin-top:8px;padding:9px 16px;border-radius:11px;background:#eef0ea;color:var(--ink);font-weight:800;font-size:13px}

#toast{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%) scale(.85);background:rgba(17,28,22,.88);border:1px solid rgba(255,255,255,.1);color:#fff;
  font-weight:900;font-size:22px;padding:11px 20px;border-radius:16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;font-size:13px;font-weight:700;opacity:.8;text-align:center}

/* Screens – dunkles Sport-Design */
.screen{position:fixed;top:0;left:0;right:0;bottom:0;min-height:100vh;min-height:100lvh;overflow-y:auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 24px);touch-action:pan-y;
  --ink:#eef3ec;--soft:#9aae9f;--card:rgba(22,36,28,.9);--line:rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(10,20,14,.22) 0%,rgba(12,22,16,.6) 30%,rgba(12,22,16,.88) 62%,rgba(12,22,16,.95) 100%);color:var(--ink)}
.screen .card{box-shadow:0 6px 20px rgba(0,0,0,.18)}
.wrap{max-width:460px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.top h2{flex:1;margin:0;font-size:22px;font-weight:900}
.screen .pill{background:#24362b;color:var(--ink);box-shadow:none}
.coins{font-weight:900;background:#24362b;color:#f2c14e;border-radius:20px;padding:8px 13px;font-size:14px;white-space:nowrap}
.logo{font-size:24px;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.logo svg{width:34px;height:34px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.prof{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#4fb576,#2f7d4f);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
.prof .tx{flex:1;min-width:0}.prof b{font-size:18px}.prof span{display:block;color:var(--soft);font-size:13px;font-weight:700;margin-top:2px}
.prof small{display:block;color:var(--soft);font-size:12px;font-weight:700;margin-top:5px}
.spn{color:#f2c14e}

<script>
'use strict';
(() => {
// =============================================================
//  FAIRWAY – Tägliches Golf  (2D von oben, Hochformat, Touch)
//  Einheiten: Meter, Sekunden, km/h
// =============================================================
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(3, window.devicePixelRatio || 1);
  W = innerWidth;
  H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  _st = _sb = null;
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hyp = Math.hypot;
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function safeVal(v) { const d = document.createElement('div'); d.style.cssText = 'position:fixed;visibility:hidden;height:' + v; document.body.appendChild(d); const h = d.offsetHeight; d.remove(); return h; }
let _st = null, _sb = null;
const safeTop = () => _st ?? (_st = safeVal('env(safe-area-inset-top,0px)'));
const safeBot = () => _sb ?? (_sb = safeVal('env(safe-area-inset-bottom,0px)'));

// ---------------- Speicher ----------------
const KEY = 'fairway_v2';
const defSave = () => ({ money: 0, earnings: 0, xp: 0, lvl: 1, sp: 1, at: { kraft: 0, praez: 0, spin: 0, putt: 0, nerven: 0 },
  gear: { driver: 0, woods: 0, irons: 0, wedges: 0, putter: 0 }, owned: { driver: [0], woods: [0], irons: [0], wedges: [0], putter: [0] },
  results: {}, tourOpen: 0, wins: 0, muted: false, rounds: 0, birdies: 0, eagles: 0, hio: 0, best: null,
  st: newSt(), hist: [], hcpHist: [] });
function newSt() { return { holes: 0, firN: 0, fir: 0, girN: 0, gir: 0, putts: 0, p1: 0, p3: 0, scrN: 0, scr: 0, sandN: 0, sandS: 0, chip: 0, pen: 0, drives: 0, driveSum: 0, driveMax: 0, proxN: 0, proxSum: 0, swings: 0, perfect: 0, par3: [0, 0], par4: [0, 0], par5: [0, 0], dist: { e: 0, b: 0, p: 0, bo: 0, d: 0 }, rounds9: 0, sum9: 0 }; }
let save = defSave();
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) { const d = defSave(); save = Object.assign(d, s); save.at = Object.assign(d.at, s.at || {}); save.gear = Object.assign(d.gear, s.gear || {}); save.owned = Object.assign(d.owned, s.owned || {}); save.st = Object.assign(newSt(), s.st || {}); } } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

// ---------------- Sound ----------------
const Snd = {
  ac: null,
  init() { if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; } try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} },
  tone(f, d, type = 'sine', v = .2, slide = 0, delay = 0) {
    if (!this.ac || save.muted) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + d + .02);
  },
  noise(d, v = .2, f = 1200, f2 = 0) {
    if (!this.ac || save.muted) return;
    const len = Math.floor(this.ac.sampleRate * d), b = this.ac.createBuffer(1, len, this.ac.sampleRate), c = b.getChannelData(0);
    for (let i = 0; i < len; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = this.ac.createBufferSource(), fl = this.ac.createBiquadFilter(), g = this.ac.createGain();
    s.buffer = b; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f, this.ac.currentTime); if (f2) fl.frequency.exponentialRampToValueAtTime(f2, this.ac.currentTime + d);
    g.gain.value = v; s.connect(fl).connect(g).connect(this.ac.destination); s.start();
  },
  tick() { this.tone(900, .03, 'square', .05); },
  swing(p) { this.noise(.22, .25, 500, 2500); setTimeout(() => { this.tone(1300 + p * 300, .05, 'triangle', .3, -600); this.noise(.05, .25, 3500); }, 140); },
  land() { this.noise(.09, .2, 300); },
  tree() { this.noise(.25, .3, 800); this.tone(160, .1, 'square', .1, -60); },

function startCup(c) {

function cupMyMatch() { const c = save.cup; return c.rounds[c.r].find(m => m.a === 0 || m.b === 0); }

    <div class="mstat">${decided ? (round.ms > 0 ? 'Du gewinnst ' : opp + ' gewinnt ') + matchResult() : 'Stand: ' + msText(round.ms) + (rem ? ' · noch ' + rem + ' Löcher' : '')}</div>

    <div class="achg">${ACH.map(a => `<div class="card ac ${got[a.id] ? 'got' : ''}"><i>${got[a.id] ? a.ic : '🔒'}</i><b>${a.n}</b><small>${a.d}</small><em>${got[a.id] ? new Date(got[a.id]).toLocaleDateString('de-DE') : '+' + money(a.r)}</em></div>`).join('')}</div>
  </div>`;
}
function renderPlayer() {
  const st = stats();
  $('#player').innerHTML = `<div class="wrap">${back('Spieler')}
    <div class="card prof" data-go="stats"><div class="av">DU</div><div class="hcpb"><small>HCP</small><b>${fmtH(hcpIndex())}</b></div><div class="tx"><b>Level ${save.lvl}</b><span>${save.sp} Skillpunkt${save.sp === 1 ? '' : 'e'} frei · pro Level +1 (alle 5 Level +2)</span></div></div>
    ${ATTRS.map(a => { const L = save.at[a.id], can = save.sp > 0 && L < AMAX;
      return `<div class="card sk"><div class="ic">${a.ic}</div><div class="tx"><div class="skh"><b>${a.n}</b><em>${L}/${AMAX}</em></div><p>${a.d}</p>
        <div class="dots">${Array.from({ length: AMAX }, (_, i) => `<i class="${i < L ? 'f' : ''}"></i>`).join('')}</div></div>
        <button class="plus ${can ? '' : 'dis'}" data-skill="${a.id}" ${can ? '' : 'disabled'}>+</button></div>`; }).join('')}
    <p class="help">Spin-Stufe aktuell: ${st.spin}/5 (aus Skill + Wedges)</p>
  </div>`;
}
function statLine(slot, m) {
  if (slot === 'putter') return `Gefühl +${Math.round(m.cap * 100)} · Linie +${Math.round(m.prev * 100)} %`;
  return `Weite +${Math.round(m.dist * 100)} % · Präzision +${Math.round(m.acc * 100)} %${m.spin ? ' · Spin +' + m.spin : ''}`;
}
function renderShop() {
  $('#shop').innerHTML = `<div class="wrap">${back('Ausrüstung')}
    <div class="tourh"><b>✨ Bälle & Spuren</b><span>rein optisch</span></div>
    <div class="balls">${BALLS.map(B => { const own = (save.balls || ['classic']).includes(B.id), eq = curBall().id === B.id, can = save.money >= B.p;
      return `<button class="card bl ${eq ? 'eq' : ''} ${!own && !can ? 'dis' : ''}" data-ball="${B.id}"><i style="background:${B.tr === 'rainbow' ? 'conic-gradient(#ff5a5a,#ffd65c,#5cc685,#5ab4ff,#a48bff,#ff5a5a)' : B.col};box-shadow:0 0 ${B.glow ? 14 : 0}px ${B.glow || 'transparent'}"></i><b>${B.n}</b><small>${eq ? 'Aktiv' : own ? 'Auswählen' : money(B.p)}</small></button>`; }).join('')}</div>
    ${Object.entries(GEAR).map(([slot, G]) => `<div class="tourh"><b>${G.ic} ${G.n}</b><span>${G.clubs.length > 1 ? G.clubs.join(' · ') : ''}</span></div>
      ${G.m.map((m, i) => { const own = save.owned[slot].includes(i), eq = save.gear[slot] === i, can = save.money >= m.p;
        const btn = eq ? `<button class="sbtn on" disabled>Im Bag</button>` : own ? `<button class="sbtn" data-equip="${slot}-${i}">Einpacken</button>` : `<button class="sbtn ${can ? '' : 'dis'}" data-buy="${slot}-${i}" ${can ? '' : 'disabled'}>${money(m.p)}</button>`;
        return `<div class="card ev gear ${eq ? 'eq' : ''}"><div class="no">${'★'.repeat(i + 1)}</div><div class="tx"><b>${m.n}</b><span>${statLine(slot, m)}</span></div>${btn}</div>`; }).join('')}`).join('')}
  </div>`;
}
document.addEventListener('click', e => {
  if (e.target.closest('#mute')) { save.muted = !save.muted; persist(); if (save.muted) Snd.ambStop(); renderHome(); return; }
  const q = sel => e.target.closest(sel);
  const g = q('[data-go]'), ev = q('[data-ev]'), b = q('[data-buy]'), eq = q('[data-equip]'), sk = q('[data-skill]');
  const cu = q('[data-cup]'), cc = q('[data-cupclose]');
  if (q('#resetStats')) { if (q('#resetStats').dataset.ok) { save.st = newSt(); save.hist = []; save.hcpHist = []; persist(); renderStats(); } else { q('#resetStats').dataset.ok = 1; q('#resetStats').textContent = 'Wirklich zurücksetzen? Nochmal tippen'; } return; }
  const bb = q('[data-ball]');
  if (bb) { const B = BALLS.find(x => x.id === bb.dataset.ball); save.balls = save.balls || ['classic']; if (!save.balls.includes(B.id)) { if (save.money < B.p) { Snd.tick(); return; } save.money -= B.p; save.balls.push(B.id); Snd.coin(); } save.ball = B.id; persist(); buzz(15); renderShop(); return; }
  const dfb = q('[data-diff]');
  if (dfb) { save.diffMode = dfb.dataset.diff; persist(); Snd.tick(); buzz(10); renderHome(); return; }
  const crs = q('[data-course]');
  if (crs) { Snd.init(); Snd.tick(); selCourse = crs.dataset.course === '__rnd' ? COURSES[Math.floor(Math.random() * COURSES.length)].id : crs.dataset.course; const C = CRS[selCourse], i = cInfo(selCourse);
    showOv(`<div class="sub" style="margin:0">${THEMES[C.th].ic} ${THEMES[C.th].n} · ${C.loc}</div><div class="big" style="font-size:30px">${C.n}</div><div class="sub">Par ${i.par} · ${(i.len / 1000).toFixed(1).replace('.', ',')} km · ${i.water} Löcher mit Hindernissen</div>${i.sigs.length ? `<div class="sigs">${i.sigs.map(x => `<span>★ ${x}</span>`).join('')}</div>` : ''}
      <div class="btns"><button class="btn" data-a="play18">18 Loch spielen</button><button class="btn g" data-a="play9">9 Loch (Front Nine)</button><button class="btn g" data-a="resume">Abbrechen</button></div>`); return; }
  if (q('[data-resume]')) { Snd.init(); curtain(resumeRound); return; }
  if (q('[data-drop]')) { delete save.cur; persist(); renderHome(); return; }
  if (cu) { Snd.init(); startCup(+cu.dataset.cup); return; }
  if (cc) { save.cup = null; persist(); showScreen('cup'); return; }
  if (g) { Snd.init(); Snd.tick(); const v = g.dataset.go; if (['free', 'ctp', 'ld', 'match'].includes(v)) curtain(() => startRound(v)); else if (mode === 'play') curtain(() => showScreen(v)); else showScreen(v); }
  else if (ev) { Snd.init(); const [t, n] = ev.dataset.ev.split('-').map(Number); curtain(() => startRound('tour', { t, e: n })); }
  else if (b) { const [slot, i] = b.dataset.buy.split('-'), m = GEAR[slot].m[+i]; if (save.money >= m.p) { save.money -= m.p; save.owned[slot].push(+i); save.gear[slot] = +i; persist(); Snd.coin(); buzz(20); renderShop(); } }
  else if (eq) { const [slot, i] = eq.dataset.equip.split('-'); save.gear[slot] = +i; persist(); Snd.tick(); renderShop(); }
  else if (sk) { const id = sk.dataset.skill; if (save.sp > 0 && save.at[id] < AMAX) { save.sp--; save.at[id]++; persist(); Snd.coin(); buzz(15); renderPlayer(); } }
});

// Test-Hook
window.__fw = {
  get state() { return state; }, get ball() { return ball; }, get hole() { return hole; }, get strokes() { return strokes; }, get round() { return round; }, get lie() { return lie; }, get save() { return save; },
  get target() { return target; }, set target(v) { target = v; }, get club() { return clubI; }, set club(v) { clubI = v; },
  startRound, genCourse, lieAt, board, hcpIndex, renderStats, courseHoles, resume: () => resumeRound(), startHoleAt: i => startHole(i), showScreenX: n => showScreen(n), unlockX: id => unlock(id), update, autoClub, carry: c => carry(CLUBS[c]),
  hit(p, a) { startSwing(); swing.p = p; swing.a = a; swing.ph = 'done'; hitBall(); },
  putt(dx, dy, v) { const l = hyp(dx, dy); doPutt({ dx: dx / l, dy: dy / l, v, p: 1 }); },
  run(maxT = 30) { for (let t = 0; t < maxT && !['aim', 'putt', 'wait', 'holed'].includes(state); t += 1 / 60) update(1 / 60); for (let i = 0; i < 200 && state === 'wait'; i++) { update(1 / 60); } },
  holeDone, finishRound, setupShot,
};

// iPhone/iPad in Safari (nicht installiert): Hinweis zum Installieren
(function iosHint() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches || window.Capacitor;
  let seen = 0; try { seen = +localStorage.getItem('fw_ios_hint') || 0; } catch (e) {}
  if (!ios || standalone || seen > 2 || location.protocol === 'file:' || window.self !== window.top) return;
  setTimeout(() => { if (mode === 'menu' && !$('#home').classList.contains('hidden')) $('#ios').classList.remove('hidden'); }, 1200);
  $('#iosX').onclick = () => { $('#ios').classList.add('hidden'); try { localStorage.setItem('fw_ios_hint', seen + 1); } catch (e) {} };
})();
resize();
showScreen('home');
requestAnimationFrame(frame);
})();

</script>

name: Voki Windows-Installer
on:
  push:
    branches: [claude/2d-story-game-kazh5h]
    paths: ['voki/**', '.github/workflows/voki-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: voki-windows
  # queue instead of cancel: a running build always finishes its release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: voki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voki/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: voki/src-tauri -> target
      - run: npm ci
      - run: npm test
      - name: Build .msi
        run: npm run tauri build -- --bundles msi
      - name: Name installer
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          cp "$(ls src-tauri/target/release/bundle/msi/*.msi | head -1)" "Voki-Setup-$v.msi"
      # Always available (needs only read access): Actions run page -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Voki-Setup-msi
          path: voki/Voki-Setup-*.msi
          retention-days: 90
      # Release is replaced only after a successful build (a failed build keeps the old installer).
      - name: Publish release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          tag="voki-v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "Voki-Setup-$v.msi" --clobber || { echo "::warning::Release nicht erlaubt: Settings > Actions > General > Workflow permissions auf 'Read and write' stellen. Installer liegt unter Artifacts."; exit 1; }
          else
            gh release create "$tag" "Voki-Setup-$v.msi" --target "$GITHUB_SHA" --title "Voki v$v für Windows" --notes "Windows-Installer für Voki: Voki-Setup-$v.msi herunterladen und doppelklicken.
          Zeigt Windows „Der Computer wurde durch Windows geschützt“: auf „Weitere Informationen“ und dann „Trotzdem ausführen“ klicken (die App ist nicht kostenpflichtig signiert)." || { echo "::warning::Release nicht erlaubt: Settings > Actions > General > Workflow permissions auf 'Read and write' stellen. Installer liegt unter Artifacts."; exit 1; }
          fi

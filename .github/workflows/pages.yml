name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/2d-story-game-kazh5h, claude/new-session-ps1d0m]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # per branch: a build-only push must not cancel the production deploy
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voki/package-lock.json
      # Voki (Vite/React) is built; everything else is served as-is.
      - name: Build Voki
        working-directory: voki
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'voki' ./ _site/
          cp -r voki/dist _site/voki
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    # The github-pages environment only accepts the default branch.
    if: github.ref == 'refs/heads/claude/2d-story-game-kazh5h' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

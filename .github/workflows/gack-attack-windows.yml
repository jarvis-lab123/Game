name: Gack Attack Windows-EXE
on:
  push:
    branches: [claude/2d-story-game-kazh5h, claude/upbeat-keller-9pvrw9]
    paths: ['gack-attack/index.html', 'gack-attack/icons/**', 'gack-attack/desktop/**', '.github/workflows/gack-attack-windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gack-attack-windows
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gack-attack/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gack-attack/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gack-attack/desktop/src-tauri -> target
      - run: npm ci
      - name: Build EXE
        run: npm run tauri build -- --bundles nsis
      - name: Name files
        shell: bash
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          cp "$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)" "out/Gack-Attack-Setup-$v.exe"
          cp src-tauri/target/release/gack-attack.exe "out/Gack-Attack-$v-portable.exe"
          ls -la out
      # Immer verfügbar: Actions-Lauf -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: Gack-Attack-Windows
          path: gack-attack/desktop/out/*.exe
          retention-days: 90
      - name: Publish release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="gack-attack-v$v"
          notes="Gack Attack für Windows. Gack-Attack-Setup-$v.exe installiert das Spiel mit Startmenü-Eintrag. Gack-Attack-$v-portable.exe startet ohne Installation (braucht WebView2, ist auf Windows 10/11 meist schon da).
          Zeigt Windows „Der Computer wurde durch Windows geschützt“: auf „Weitere Informationen“ und dann „Trotzdem ausführen“ klicken (die App ist nicht kostenpflichtig signiert)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.exe --clobber || { echo "::warning::Release nicht erlaubt: Settings > Actions > General > Workflow permissions auf 'Read and write' stellen. EXE liegt unter Artifacts."; exit 1; }
          else
            gh release create "$tag" out/*.exe --target "$GITHUB_SHA" --title "Gack Attack v$v für Windows" --notes "$notes" || { echo "::warning::Release nicht erlaubt: Settings > Actions > General > Workflow permissions auf 'Read and write' stellen. EXE liegt unter Artifacts."; exit 1; }
          fi

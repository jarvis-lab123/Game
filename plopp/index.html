<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef1ea">
<title>Plopp – Daily Golf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plopp">
<style>
:root{--bg:#eef1ea;--ink:#2d3a2e;--soft:#7d8a7c;--card:#fff;--acc:#4f9d5d;--gold:#e9b949;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(var(--st) + 12px) 16px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#hud .grow{flex:1}
#hudTitle{font-weight:800;font-size:17px;letter-spacing:.2px}
#hudSub{font-size:13px;color:var(--soft);font-weight:600;margin-top:2px}
#strokes{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
#strokesLbl{font-size:11px;color:var(--soft);font-weight:700;text-align:right;letter-spacing:.8px;text-transform:uppercase}
.iconBtn{pointer-events:auto;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:18px;font-weight:800;box-shadow:0 2px 0 rgba(0,0,0,.06)}
#bar{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(var(--sb) + 14px);display:flex;justify-content:center;gap:8px;pointer-events:none}
.ab{pointer-events:auto;position:relative;width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:24px;
  box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .08s,opacity .15s}
.ab:active{transform:scale(.92)}
.ab.off{opacity:.35}
.ab.on{box-shadow:0 0 0 3px var(--acc),0 3px 0 rgba(0,0,0,.08)}
.ab .n{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.ab .n.z{background:#c9cec7}
#hint{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 84px);text-align:center;font-size:14px;font-weight:700;color:var(--soft);pointer-events:none;transition:opacity .4s}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);font-size:34px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.15);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- Screens ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;background:var(--bg);padding:calc(var(--st) + 18px) 18px calc(var(--sb) + 24px);touch-action:pan-y}
.wrap{max-width:440px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.top h2{flex:1;margin:0;font-size:22px;font-weight:900}
.coins{font-weight:800;background:#fff;border-radius:20px;padding:7px 12px;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.coins b{color:#c99a1e}
.logo{font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1;margin:26px 0 10px}
.logo i{font-style:normal;display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--ink);margin-left:2px}
.tag{color:var(--soft);font-weight:700;margin-bottom:26px}
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:0 3px 0 rgba(0,0,0,.05);margin-bottom:12px}
.daily{background:var(--acc);color:#fff}
.daily .k{opacity:.8;font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.daily .t{font-size:30px;font-weight:900;margin:4px 0 10px}
.daily .s{font-weight:700;opacity:.95;margin-bottom:14px;font-size:15px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:17px;background:var(--ink);color:#fff;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.w{background:#fff;color:var(--ink)}
.btn.g{background:#e6e9e3;color:var(--ink);box-shadow:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.mi .ic{width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:23px;flex:none}
.mi .tx{flex:1}
.mi .tx b{display:block;font-size:17px}
.mi .tx span{color:var(--soft);font-size:13px;font-weight:600}
.mi .ar{color:var(--soft);font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{aspect-ratio:1;border-radius:18px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.05)}
.hole b{font-size:24px;font-weight:900}
.hole span{font-size:12px;font-weight:800;color:var(--soft);margin-top:2px}
.hole.lock{opacity:.4}
.hole .u{color:var(--acc)}.hole .o{color:#d0743c}
.sk{display:flex;gap:14px;align-items:flex-start}
.sk .ic{width:52px;height:52px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:26px;flex:none}
.sk .tx{flex:1}
.sk .tx b{font-size:17px}
.sk .tx p{margin:3px 0 8px;color:var(--soft);font-size:13px;font-weight:600;line-height:1.35}
.dots{display:flex;gap:5px;margin-bottom:10px}
.dots i{width:22px;height:6px;border-radius:3px;background:#e2e6df}
.dots i.f{background:var(--acc)}
.sbtn{padding:9px 14px;border-radius:12px;font-weight:800;font-size:14px;background:var(--ink);color:#fff}
.sbtn.dis{background:#e2e6df;color:#a5ada3}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:900}
.stat span{font-size:12px;color:var(--soft);font-weight:700}

/* ---------- Result ---------- */
#result{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,40,30,.25);padding:0 14px calc(var(--sb) + 14px)}
#result .card{width:100%;max-width:420px;text-align:center;padding:24px 20px 20px;animation:up .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
#rName{font-size:40px;font-weight:900;letter-spacing:-1px}
#rSub{color:var(--soft);font-weight:700;margin:4px 0 14px}
#rCoins{display:inline-block;background:#fdf3d6;color:#a87b0c;font-weight:900;border-radius:14px;padding:8px 14px;margin-bottom:16px}
#rBtns{display:flex;flex-direction:column;gap:9px}
#rot{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;text-align:center;font-weight:800;font-size:18px;padding:30px}
@media (orientation:landscape) and (max-height:500px){#rot{display:grid}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <button class="iconBtn" id="menuBtn" aria-label="Menü">✕</button>
  <div class="grow"><div id="hudTitle"></div><div id="hudSub"></div></div>
  <div><div id="strokes">0</div><div id="strokesLbl">Schläge</div></div>
</div>
<div id="hint"></div>
<div id="bar" class="hidden"></div>
<div id="toast"></div>

<div id="home" class="screen"></div>
<div id="course" class="screen hidden"></div>
<div id="shop" class="screen hidden"></div>
<div id="result" class="hidden"><div class="card"><div id="rName"></div><div id="rSub"></div><div id="rCoins"></div><div id="rBtns"></div></div></div>
<div id="rot">Bitte dreh dein Handy ins Hochformat 📱</div>

<script src="game.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

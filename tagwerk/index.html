<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tagwerk">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Tagwerk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: first screen = departure clock + one task inside a draining circle. Everything else lives below the fold. Light-only monochrome. */
:root{
  --bg:#f4f4f2; --paper:#ffffff; --ink:#0d0d0d; --ink2:#7c7c78; --ink3:#b9b9b4; --line:#e4e4e0;
  --sans:"Geist",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.5,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;
  user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:8px}
.app{max-width:460px;margin:0 auto;display:flex;flex-direction:column}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500}

/* ---------- first screen ---------- */
.mini span{display:inline-block}
.mini span.tick{animation:roll .45s var(--ease)}
.bar .dim{color:var(--ink3)}
.below{transition:opacity .6s var(--ease),transform .6s var(--ease)}
.below.hide{opacity:0;transform:translateY(30px)}
.hero{min-height:calc(100svh - 14px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;padding-top:4px}
.bar .lbl b{color:var(--ink);font-weight:500}
.clock{font-family:var(--mono);font-weight:300;font-size:clamp(64px,21vw,104px);line-height:.9;letter-spacing:-.06em;display:flex;font-variant-numeric:tabular-nums;margin-top:10px}
.clock span{display:inline-block;min-width:.6em;text-align:center}
.clock span.sep{min-width:.35em;color:var(--ink3)}
.clock span.tick{animation:roll .45s var(--ease)}
@keyframes roll{from{transform:translateY(-38%);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}

.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:18px 8px}
.view{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;animation:in .6s var(--ease) both}
.view.out{animation:out .38s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(22px) scale(.985);filter:blur(6px)}}
@keyframes out{to{opacity:0;transform:translateY(-26px) scale(.97);filter:blur(8px)}}

.task{font-size:clamp(36px,10.5vw,48px);font-weight:500;letter-spacing:-.04em;line-height:1.04;text-wrap:balance;margin:0;max-width:13ch}
.hint{font-size:15px;color:var(--ink2);line-height:1.45;margin:0;max-width:32ch}

/* the draining circle = hold button */
.orb{position:relative;width:min(80vw,320px);aspect-ratio:1;max-width:100%;border-radius:50%;touch-action:none;outline-offset:8px}
.orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.orb .track{fill:none;stroke:var(--line);stroke-width:1.2}
.orb .tk{stroke:var(--line);stroke-width:.4;stroke-linecap:round;transition:stroke .6s}
.orb .tk.big{stroke-width:.7}
.orb .tk.on{stroke:var(--ink3)}
.orb .tk.big.on{stroke:var(--ink2)}
.orb .left{transition:stroke-dashoffset 1s linear,stroke-width .3s var(--ease)}
.orb.pressing .left{stroke-width:3.2}
.orb .left{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.orb .head{fill:var(--ink);transition:cx 1s linear,cy 1s linear}
.orb.over .head{animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.15}}
.orb .core{position:absolute;inset:9%;border-radius:50%;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;transition:transform .35s var(--spring);box-shadow:0 30px 60px -30px rgba(0,0,0,.18)}
.orb .fill{position:absolute;inset:0;border-radius:50%;background:var(--ink);transform:scale(0)}
.orb .num,.orb .sub{position:relative;color:#fff;mix-blend-mode:difference}
.orb .num{font-family:var(--mono);font-weight:300;font-size:clamp(44px,13vw,58px);letter-spacing:-.05em;line-height:1}
.orb .sub{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:500;opacity:.55}
.orb.pressing .core{transform:scale(.95)}
.orb.burst .core{animation:pop .6s var(--spring)}
@keyframes pop{40%{transform:scale(1.08)}}
.orb.over .core{background:var(--ink)}
.under{display:flex;gap:18px;align-items:center;font-size:13px;color:var(--ink2)}
.under button{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.more.gone{opacity:0}
.more{transition:opacity .4s;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding-bottom:4px;animation:float 2.6s ease-in-out infinite}
.more svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
@keyframes float{50%{transform:translateY(4px)}}

/* park a thought */
.park{display:flex;gap:8px;width:100%;max-width:340px;animation:in .4s var(--ease)}
.park input{flex:1;min-width:0;font:inherit;font-size:15px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:11px 16px}
.park button{border-radius:999px;background:var(--ink);color:var(--paper);padding:0 16px;font-size:14px;font-weight:500}

/* rewards */
.reward h2{font-size:30px;font-weight:500;letter-spacing:-.03em;margin:0;line-height:1.1;text-wrap:balance}
.scratch{position:relative;width:100%;aspect-ratio:1.45;max-width:100%;border-radius:22px;overflow:hidden;background:var(--paper);touch-action:none}
.scratch .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center}
.scratch .prize b{font-size:22px;font-weight:500;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .5s}
.btn{border-radius:999px;padding:16px 28px;background:var(--ink);color:var(--paper);font-weight:500;font-size:16px;transition:transform .2s var(--spring),opacity .3s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.25;pointer-events:none}
.react{width:220px;height:220px;max-width:100%;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:18px;font-weight:500;transition:background .12s,transform .2s var(--spring);touch-action:manipulation}
.react.go{background:var(--ink);color:var(--paper);transform:scale(1.04)}
.breath{width:230px;height:230px;max-width:100%;position:relative;display:grid;place-items:center}
.breath i{position:absolute;inset:0;border-radius:50%;border:1.2px solid var(--line)}
.breath b{position:absolute;inset:22%;border-radius:50%;background:var(--ink);transform:scale(.35);transition:transform 4s cubic-bezier(.45,0,.55,1)}
.breath span{position:relative;color:#fff;mix-blend-mode:difference;font-size:15px;font-weight:500}

/* final */
.final .big{font-size:56px;font-weight:300;letter-spacing:-.05em;line-height:1}

/* ---------- below the fold ---------- */
.below{display:flex;flex-direction:column;gap:44px;padding-top:56px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>.lbl{padding:0 4px}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:13px 4px;border-top:1px solid var(--line);font-size:16px;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .c{width:18px;height:18px;border-radius:50%;border:1.3px solid var(--ink3);display:grid;place-items:center}
.row.d .c{background:var(--ink);border-color:var(--ink)}
.row.d .c::after{content:"";width:7px;height:4px;border-left:1.4px solid #fff;border-bottom:1.4px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.row.d .n{color:var(--ink3);text-decoration:line-through}
.row.cur .n{font-weight:600}
.row .n{min-width:0}
.row .tm{font-size:13px;color:var(--ink2)}
.empty{font-size:14px;color:var(--ink3);padding:4px;grid-column:1/-1}

.segs{height:4px;display:flex;gap:3px;margin:6px 4px 0;position:relative}
.segs i{height:100%;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .8s var(--ease)}
.segs i.d::after{transform:scaleX(1)}
.segs i.c{background:var(--ink3)}
.nowmark{position:absolute;top:-8px;width:2px;height:20px;background:var(--ink);transform:translateX(-1px);transition:left 1s linear}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);padding:6px 4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:20px;overflow:hidden}
.stats div{background:var(--bg);padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.stats b{font-family:var(--mono);font-weight:300;font-size:30px;letter-spacing:-.04em;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--paper);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35;animation:in .5s var(--ease)}
.tile.lock{background:transparent;border:1px dashed var(--ink3);color:var(--ink3);justify-content:center;align-items:center;min-height:84px;font-family:var(--mono)}
.foot{text-align:center;font-size:12px;color:var(--ink3);padding-top:8px}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;transition:transform .5s var(--spring);z-index:40;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
:root.end{--bg:#0d0d0d;--paper:#1b1b1a;--ink:#f4f4f2;--ink2:#8c8c87;--ink3:#4d4d4a;--line:#2a2a28;color-scheme:dark}
html,body{transition:background-color 1.2s var(--ease),color 1.2s var(--ease)}
.sub-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.noise{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:500;display:flex;gap:7px;align-items:center;white-space:nowrap}
.noise i{width:7px;height:7px;border-radius:50%;border:1px solid var(--ink3)}
.noise.on{color:var(--ink)}
.noise.on i{background:var(--ink);border-color:var(--ink);animation:blink 1.6s infinite}
.float{position:fixed;z-index:35;font-family:var(--mono);font-size:30px;font-weight:300;letter-spacing:-.04em;color:var(--ink);pointer-events:none;transform:translate(-50%,-50%);animation:rise 1.7s var(--ease) forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-300%)}}
.receipt{background:var(--paper);border-radius:4px 4px 0 0;padding:24px 18px 30px;font-family:var(--mono);font-size:13px;line-height:1.75;color:var(--ink);-webkit-mask:radial-gradient(circle at 7px 100%,transparent 5px,#000 5.5px) 0 0/14px 100% repeat-x;mask:radial-gradient(circle at 7px 100%,transparent 5px,#000 5.5px) 0 0/14px 100% repeat-x}
.receipt .rh{text-align:center;letter-spacing:.22em;font-size:12px;color:var(--ink2)}
.receipt hr{border:0;border-top:1px dashed var(--ink3);margin:10px 0}
.receipt .rr{display:grid;grid-template-columns:1fr auto 3.2em;gap:10px}
.receipt .rr span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.receipt .rr span:last-child{text-align:right}
.receipt .tot{display:flex;justify-content:space-between;font-weight:500;font-size:15px}
.receipt .muted{color:var(--ink3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="app">
  <section class="hero">
    <div class="bar"><span class="lbl"><span id="clockLbl">Los um</span> <b class="mono" id="leave"></b> <span class="dim">· noch</span> <b class="mono mini" id="clock"></b></span><button class="noise" id="noise" aria-pressed="false"><i></i>Rauschen</button></div>
    <div class="stage" id="stage"></div>
    <div class="more" aria-hidden="true"><span>Mehr</span><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></div>
  </section>

  <section class="below hide" id="below">
    <div class="sec"><span class="lbl">Dein Tag</span>
      <div><div class="segs" id="segs"></div><div class="ticks mono" id="ticks"></div></div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="sec"><span class="lbl">Geparkte Gedanken</span><div class="rows" id="parked"></div></div>

    <div class="sec"><span class="lbl" id="colLbl">Gesammelt</span><div class="tiles" id="tiles"></div></div>

    <div class="sec"><span class="lbl">Beleg</span><div class="receipt" id="receipt"></div></div>

    <div class="sec"><span class="lbl">Plan · antippen zum Abhaken</span><div class="rows" id="list"></div></div>

    <div class="foot">Bleibt auf diesem Gerät gespeichert.</div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== Tagesdaten: für einen neuen Tag nur DAY ändern ===== */
const DAY = {
  id: "2026-11-02",
  date: "2026-11-02",
  start: "14:25",
  leave: "17:20",
  tasks: [
    { t:"Mittagessen",                         h:"In Ruhe essen. Handy weg.",                                     until:"15:05" },
    { t:"Unterlagen bereitlegen",              h:"Heft, Blätter, Stift. Themen in sicher und unsicher sortieren.", until:"15:15" },
    { t:"Unsichere Themen verstehen, Teil 1",  h:"Das schwierigste Thema zuerst. Laut erklären, bis es sitzt.",     until:"15:40" },
    { t:"Unsichere Themen verstehen, Teil 2",  h:"Die restlichen unsicheren Themen.",                               until:"15:58" },
    { t:"Aufgaben rechnen",                    h:"Fünf Aufgaben aus Heft oder Buch. Ohne nachzuschauen.",            until:"16:22" },
    { t:"Fehler korrigieren",                  h:"Jeden Fehler verstehen und einmal richtig nachrechnen.",           until:"16:37" },
    { t:"Definitionen auswendig lernen",       h:"Begriffe und Formeln, die du morgen sicher brauchst.",             until:"17:00" },
    { t:"Spickzettel aus dem Kopf schreiben",  h:"Eine Seite, alles was du weisst. Danach Lücken nachschauen.",      until:"17:15" },
    { t:"Tasche packen",                       h:"Stifte, Taschenrechner, Unterlagen. Dann los.",                    until:"17:20" }
  ]
};

const REWARDS = [
  ["Glas Wasser","Ganz austrinken. Dann weiter."],
  ["Fun Fact","Ein Golfball hat meist zwischen 300 und 500 Dimples."],
  ["Steh auf","10 Kniebeugen. Blut in den Kopf."],
  ["Fun Fact","Diamant und Bleistiftmine sind beide reiner Kohlenstoff."],
  ["Ein Song","Ein Lied deiner Wahl. Nur eins."],
  ["Fun Fact","Bananen sind leicht radioaktiv. Schuld ist Kalium-40."],
  ["Fenster auf","30 Sekunden frische Luft."],
  ["Fun Fact","Honig verdirbt praktisch nie."],
  ["Snack","Eine Handvoll Nüsse oder ein Stück Obst."],
  ["Fun Fact","Ein Blitz ist rund fünfmal heisser als die Oberfläche der Sonne."]
];

/* ===== State ===== */
const KEY = "tagwerk3:" + DAY.id;
let S = { done:{}, best:null, got:[], parked:[], away:0, focusSince:Date.now(), longest:0, warned:{} };
try{ S = Object.assign(S, JSON.parse(localStorage.getItem(KEY)) || {}); }catch{}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} };

/* ===== Zeit ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const at = hm => { const [h,m] = hm.split(":").map(Number); const d = new Date(DAY.date+"T00:00:00"); d.setHours(h,m,0,0); return d.getTime(); };
const T0 = at(DAY.start), LEAVE = at(DAY.leave);
const TASKS = DAY.tasks.map((x,i) => ({ ...x, i, end: at(x.until), begin: i ? at(DAY.tasks[i-1].until) : T0 }));
const cur = () => TASKS.find(x => !S.done[x.i]);
const pad = n => String(n).padStart(2,"0");
const hms = ms => { const s = Math.max(0, Math.floor(ms/1000)); return Math.floor(s/3600)+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60); };
const mmss = ms => { const s = Math.floor(Math.abs(ms)/1000), h = Math.floor(s/3600); return (h ? h+":"+pad(Math.floor(s%3600/60)) : Math.floor(s/60)) + ":" + pad(s%60); };
const fmtT = ms => { const d = new Date(ms); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ===== Sound / Haptik ===== */
let AC;
function tone(f, d=.12, v=.05, type="sine", when=0){
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch{}
}
const sfxDone = () => [659,880,1319].forEach((f,i)=>tone(f,.35,.05,"sine",i*.07));
const vib = p => { try{ navigator.vibrate && navigator.vibrate(p); }catch{} };

/* ===== Partikel ===== */
const fx = $("#fx"), g = fx.getContext("2d"); let P = [], raf = 0, INK = "#0d0d0d";
function burst(x, y, n=70){
  if (reduced()) return;
  INK = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#0d0d0d";
  const r = devicePixelRatio || 1; fx.width = innerWidth*r; fx.height = innerHeight*r;
  for (let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, s = 2+Math.random()*9;
    P.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s-3, life:1, sz:1.5+Math.random()*3.5, sq:Math.random()<.4, rot:Math.random()*6 }); }
  if (!raf) step();
}
function step(){
  const r = devicePixelRatio || 1; g.setTransform(r,0,0,r,0,0); g.clearRect(0,0,innerWidth,innerHeight);
  P = P.filter(p => p.life > 0);
  for (const p of P){ p.vx *= .96; p.vy = p.vy*.96 + .18; p.x += p.vx; p.y += p.vy; p.life -= .016; p.rot += .1;
    g.globalAlpha = Math.max(0,p.life); g.fillStyle = INK;
    if (p.sq){ g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.fillRect(-p.sz,-p.sz/2,p.sz*2,p.sz); g.restore(); }
    else { g.beginPath(); g.arc(p.x,p.y,p.sz,0,7); g.fill(); } }
  raf = P.length ? requestAnimationFrame(step) : (g.clearRect(0,0,innerWidth,innerHeight), 0);
}
let tT; function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(tT); tT = setTimeout(()=>t.classList.remove("show"), 2400); }

/* ===== Abfahrtsuhr ===== */
let lastClock = "";
function renderClock(){
  const now = Date.now(), left = LEAVE - now;
  const str = left > 0 ? hms(left) : "0:00:00", el = $("#clock");
  if (lastClock.length !== str.length) el.innerHTML = [...str].map((c,i) => `<span class="tick ${c===":"?"sep":""}" style="animation-delay:${i*45}ms">${c}</span>`).join("");
  else [...str].forEach((c,i) => { if (c !== lastClock[i]){ const s = el.children[i]; s.textContent = c; s.classList.remove("tick"); void s.offsetWidth; s.classList.add("tick"); } });
  lastClock = str;
  const endOn = left > 0 && left < 30*60000, root = document.documentElement;
  if (endOn !== root.classList.contains("end")){ root.classList.toggle("end", endOn); if (endOn){ toast("Endspurt. Letzte 30 Minuten."); tone(523,.3,.04); tone(784,.4,.04,"sine",.15); } }
  $("#clockLbl").textContent = left > 0 ? "Los um" : "Zeit zu gehen";
}

/* ===== Bühne ===== */
const stage = $("#stage");
function swap(html, after){
  const old = stage.firstElementChild;
  const put = () => { stage.innerHTML = html; after && after(); };
  if (old && !reduced()){ old.classList.add("out"); setTimeout(put, 330); } else put();
}

const R = 48, CIRC = 2*Math.PI*R;
const TICKS = Array.from({length:60}, (_,i) => { const a = i/60*Math.PI*2, r1 = i%5 ? 43.9 : 42.6, r2 = 45.2;
  return `<line class="tk${i%5 ? "" : " big"}" x1="${(50+r1*Math.sin(a)).toFixed(2)}" y1="${(50-r1*Math.cos(a)).toFixed(2)}" x2="${(50+r2*Math.sin(a)).toFixed(2)}" y2="${(50-r2*Math.cos(a)).toFixed(2)}"/>`; }).join("");
function showTask(){
  const c = cur(); if (!c) return showFinal();
  swap(`<div class="view">
    <span class="lbl mono">Jetzt · ${c.i+1} von ${TASKS.length}</span>
    <h1 class="task">${esc(c.t)}</h1>
    <p class="hint">${esc(c.h||"")}</p>
    <button class="orb" id="orb" aria-label="Gedrückt halten, um „${esc(c.t)}“ abzuschliessen">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${R}"/><g id="tks">${TICKS}</g>
        <circle class="left" id="ring" cx="50" cy="50" r="${R}" stroke-dasharray="${CIRC}" stroke-dashoffset="0" transform="rotate(-90 50 50)"/>
        <circle class="head" id="head" cx="50" cy="2" r="1.8"/></svg>
      <div class="core"><div class="fill" id="fill"></div><span class="num" id="dueT">–</span><span class="sub mono" id="dueL">bis ${c.until}</span></div>
    </button>
    <div class="under"><span>Gedrückt halten, wenn erledigt</span><button id="parkBtn">Gedanke parken</button></div>
    <div id="parkSlot"></div>
  </div>`, () => { bindHold(c); $("#parkBtn").onclick = openPark; tickTask(true); });
}

function tickTask(first){
  const c = cur(), t = $("#dueT"); if (!c || !t) return;
  const now = Date.now(), rem = c.end - now, orb = $("#orb");
  const span = c.end - Math.min(c.begin, now);
  const frac = rem <= 0 ? 0 : Math.min(1, rem / Math.max(span, 1));
  if (now < c.begin){ t.textContent = mmss(c.begin - now); $("#dueL").textContent = "bis Start " + fmtT(c.begin); orb.classList.remove("over"); }
  else if (rem >= 0){ t.textContent = mmss(rem); $("#dueL").textContent = "bis " + c.until; orb.classList.remove("over"); }
  else { t.textContent = "+" + mmss(rem); $("#dueL").textContent = "drüber"; orb.classList.add("over"); }
  const ring = $("#ring"), head = $("#head");
  if (first){ ring.style.transition = head.style.transition = "none"; }
  ring.style.strokeDashoffset = CIRC * (1 - frac);
  const on = Math.ceil(frac*60); document.querySelectorAll("#tks line").forEach((l,i) => l.classList.toggle("on", i < on));
  const a = -Math.PI/2 + frac * Math.PI*2; head.setAttribute("cx", 50 + R*Math.cos(a)); head.setAttribute("cy", 50 + R*Math.sin(a));
  if (first) requestAnimationFrame(() => { ring.style.transition = head.style.transition = ""; });
  // Signale: Halbzeit und letzte Minute
  const w = S.warned[c.i] || {};
  if (now >= c.begin && rem > 0){
    if (!w.h && rem < (c.end - c.begin)/2){ w.h = 1; tone(660,.15,.03); }
    if (!w.m && rem < 60000){ w.m = 1; tone(880,.12,.05); tone(880,.12,.05,"sine",.18); vib([30,60,30]); toast("Noch eine Minute für diese Aufgabe"); }
    S.warned[c.i] = w;
  }
}

/* Halten zum Abschliessen */
function bindHold(c){
  const b = $("#orb"), fill = $("#fill"), DUR = 900;
  let start = 0, id = 0, holding = false, q0 = 0;
  const frame = () => {
    const p = Math.min(1, (performance.now() - start) / DUR);
    fill.style.transform = `scale(${1 - Math.pow(1-p, 3)})`;
    const q = Math.floor(p*6); if (q > q0){ q0 = q; tone(300 + q*90, .05, .03, "triangle"); vib(6); }
    if (p >= 1){ holding = false; complete(c, b); return; }
    id = requestAnimationFrame(frame);
  };
  const down = e => { if (holding) return; e.preventDefault(); holding = true; q0 = 0; start = performance.now(); b.classList.add("pressing"); id = requestAnimationFrame(frame); };
  const up = () => { if (!holding) return; holding = false; cancelAnimationFrame(id); b.classList.remove("pressing");
    fill.style.transition = "transform .35s cubic-bezier(.2,.8,.2,1)"; fill.style.transform = "scale(0)"; setTimeout(()=>fill.style.transition="", 360); };
  b.addEventListener("pointerdown", down); ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, up));
  b.addEventListener("keydown", e => { if ((e.key===" "||e.key==="Enter") && !e.repeat) down(e); });
  b.addEventListener("keyup", e => { if (e.key===" "||e.key==="Enter") up(); });
  b.addEventListener("contextmenu", e => e.preventDefault());
}

function complete(c, b){
  S.done[c.i] = Date.now(); save();
  b.classList.remove("pressing"); b.classList.add("burst");
  const r = b.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 90);
  floatTxt(r, c.end - Date.now());
  sfxDone(); vib([12,40,18]); renderBelow();
  setTimeout(() => { cur() ? showReward(c) : showFinal(); }, 650);
}

function floatTxt(r, ms){
  const m = Math.round(ms/60000), el = document.createElement("div");
  el.className = "float"; el.textContent = m > 0 ? "+" + m + " min" : m === 0 ? "pünktlich" : m + " min";
  el.style.left = (r.left + r.width/2) + "px"; el.style.top = (r.top + r.height*.3) + "px";
  document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

/* Gedanke parken */
function openPark(){
  const slot = $("#parkSlot"); if (slot.firstChild){ slot.innerHTML = ""; return; }
  slot.innerHTML = `<form class="park" id="parkForm"><input id="parkIn" placeholder="Was lenkt dich ab?" autocomplete="off" maxlength="80"><button>Parken</button></form>`;
  const inp = $("#parkIn"); inp.focus();
  $("#parkForm").onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return;
    S.parked.push({ t:v, d:false }); save(); renderBelow(); slot.innerHTML = ""; tone(520,.1,.04); toast("Geparkt. Später drum kümmern."); };
}

/* ===== Belohnungen ===== */
function showReward(prev){
  const n = Object.keys(S.done).length, kind = ["scratch","breath","react"][(n-1) % 3];
  if (kind === "breath") return showBreath(prev);
  if (kind === "react") return showReact(prev);
  const idx = S.got.length % REWARDS.length, [head, body] = REWARDS[idx];
  swap(`<div class="view reward">
    <span class="lbl">Erledigt: ${esc(prev.t)}</span>
    <h2>Rubbel dir was frei.</h2>
    <div class="scratch" id="sc"><div class="prize"><span class="lbl">${esc(head)}</span><b>${esc(body)}</b></div><canvas id="scc"></canvas></div>
    <button class="btn" id="go" disabled>Nächste Aufgabe</button>
  </div>`, () => {
    scratch(() => { $("#go").disabled = false; S.got.push(idx); save(); renderBelow(); tone(1046,.3,.04); });
    $("#go").onclick = showTask; setTimeout(() => { const b = $("#go"); if (b) b.disabled = false; }, 8000);
  });
}

function scratch(onReveal){
  const cv = $("#scc"), box = $("#sc"), r = devicePixelRatio || 1;
  const w = box.clientWidth, h = box.clientHeight; cv.width = w*r; cv.height = h*r;
  const x = cv.getContext("2d", { willReadFrequently:true }); x.scale(r,r);
  x.fillStyle = "#0d0d0d"; x.fillRect(0,0,w,h);
  x.fillStyle = "rgba(255,255,255,.06)"; for (let i=0;i<w;i+=8) for (let j=(i/8%2)*4;j<h;j+=8) x.fillRect(i,j,1.2,1.2);
  x.fillStyle = "rgba(255,255,255,.75)"; x.font = "500 14px Geist, sans-serif"; x.textAlign = "center"; x.fillText("HIER RUBBELN", w/2, h/2+5);
  x.globalCompositeOperation = "destination-out"; x.lineCap = "round"; x.lineJoin = "round"; x.lineWidth = 46;
  let down = false, last = null, revealed = false, strokes = 0;
  const pos = e => { const b = cv.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  const check = () => {
    const d = x.getImageData(0,0,cv.width,cv.height).data; let clear = 0, tot = 0;
    for (let i=3;i<d.length;i+=160){ tot++; if (d[i] < 20) clear++; }
    if (clear/tot > .5 && !revealed){ revealed = true; cv.style.opacity = 0; setTimeout(()=>cv.remove(), 500); onReveal(); burst(innerWidth/2, box.getBoundingClientRect().top + h/2, 40); }
  };
  cv.addEventListener("pointerdown", e => { down = true; last = pos(e); cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => { if (!down) return; const p = pos(e);
    x.beginPath(); x.moveTo(...last); x.lineTo(...p); x.stroke(); last = p;
    if (++strokes % 6 === 0){ tone(2000+Math.random()*1500, .03, .008, "square"); check(); } });
  const up = () => { down = false; check(); };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
}

function showBreath(prev){
  swap(`<div class="view reward">
    <span class="lbl">Erledigt: ${esc(prev.t)}</span>
    <h2>Drei Atemzüge.</h2>
    <div class="breath"><i></i><b id="bb"></b><span id="bt">Bereit</span></div>
    <span class="lbl mono" id="bc">1 / 3</span>
    <button class="btn ghost" id="go">Nächste Aufgabe</button>
  </div>`, () => {
    const bb = $("#bb"), bt = $("#bt"), bc = $("#bc"); let n = 0, alive = true;
    const cycle = () => { if (!alive || !$("#bb")) return;
      if (n >= 3){ bt.textContent = "Gut."; bc.textContent = "fertig"; $("#go").className = "btn"; tone(1046,.4,.04); return; }
      bc.textContent = (n+1) + " / 3"; bt.textContent = "Einatmen"; bb.style.transform = "scale(1)"; tone(392,.6,.025);
      setTimeout(() => { if (!$("#bb")) return; bt.textContent = "Ausatmen"; bb.style.transform = "scale(.35)"; tone(294,.6,.025); }, 4000);
      setTimeout(() => { n++; cycle(); }, 8000);
    };
    setTimeout(cycle, 600);
    $("#go").onclick = () => { alive = false; showTask(); };
  });
}

function showReact(prev){
  swap(`<div class="view reward">
    <span class="lbl">Erledigt: ${esc(prev.t)}</span>
    <h2>Wie schnell bist du?</h2>
    <p class="hint">Tippe, sobald der Kreis schwarz wird.</p>
    <button class="react" id="rx">Antippen zum Start</button>
    <span class="lbl mono" id="rbest">${S.best ? "Bestzeit " + S.best + " ms" : "Noch keine Bestzeit"}</span>
    <button class="btn ghost" id="go">Nächste Aufgabe</button>
  </div>`, () => {
    const b = $("#rx"); let st = "idle", t0 = 0, to = 0;
    b.onpointerdown = e => { e.preventDefault();
      if (st === "idle" || st === "res"){ st = "wait"; b.textContent = "Warten …"; b.classList.remove("go");
        to = setTimeout(() => { st = "go"; t0 = performance.now(); b.textContent = "Jetzt!"; b.classList.add("go"); tone(880,.08,.05); }, 1200 + Math.random()*2200); }
      else if (st === "wait"){ clearTimeout(to); st = "res"; b.textContent = "Zu früh. Nochmal"; tone(200,.2,.05,"triangle"); vib(40); }
      else if (st === "go"){ const ms = Math.round(performance.now() - t0); st = "res"; b.classList.remove("go");
        const rec = !S.best || ms < S.best; if (rec){ S.best = ms; save(); renderBelow(); }
        b.textContent = ms + " ms" + (rec ? " · Rekord" : ""); $("#rbest").textContent = "Bestzeit " + S.best + " ms";
        if (rec){ const r = b.getBoundingClientRect(); burst(r.left+r.width/2, r.top+r.height/2, 60); sfxDone(); } else tone(660,.12,.04); }
    };
    $("#go").onclick = () => { clearTimeout(to); showTask(); };
  });
}

function showFinal(){
  const last = Math.max(...Object.values(S.done)), early = Math.round((LEAVE - last)/60000);
  swap(`<div class="view final">
    <span class="lbl">Alles erledigt</span>
    <div class="big">Fertig.</div>
    <p class="hint">${early >= 0 ? early + " Minuten vor der Abfahrt." : "Geschafft."} Morgen schreibst du das ohne Spicker.</p>
    <button class="btn ghost" id="toR">Beleg ansehen</button>
  </div>`, () => { $("#toR").onclick = () => $("#receipt").scrollIntoView({ behavior:"smooth", block:"center" }); burst(innerWidth*.3, innerHeight*.4, 80); burst(innerWidth*.7, innerHeight*.4, 80); });
}

/* ===== Unten ===== */
function focusMin(){ return Math.floor((Date.now() - S.focusSince)/60000); }
function renderBelow(){
  const c = cur(), now = Date.now();

  $("#segs").innerHTML = TASKS.map(x => `<i style="flex:${x.end-x.begin}" class="${S.done[x.i]?"d":""} ${c&&c.i===x.i?"c":""}"></i>`).join("") + `<span class="nowmark" id="nowmark"></span>`;
  $("#ticks").innerHTML = `<span>${DAY.start}</span><span>${DAY.leave}</span>`;
  const n = Object.keys(S.done).length;
  const lead = n && c ? Math.round((c.begin - now)/60000) : null;
  let streak = 0; for (const x of TASKS){ if (!S.done[x.i]) break; streak = S.done[x.i] <= x.end ? streak + 1 : 0; }
  $("#stats").innerHTML = `
    <div><b>${n}/${TASKS.length}</b><span class="lbl">erledigt</span></div>
    <div><b>${lead == null ? "0" : (lead > 0 ? "+" : "") + lead}</b><span class="lbl">${lead != null && lead < 0 ? "min Rückstand" : "min Vorsprung"}</span></div>
    <div><b id="focusN">${focusMin()}</b><span class="lbl">min am Stück dran</span></div>
    <div><b>${S.best ?? "–"}</b><span class="lbl">ms Reaktion</span></div>
    <div><b>${streak}</b><span class="lbl">pünktlich in Folge</span></div>
    <div><b>${S.away}</b><span class="lbl">mal abgelenkt</span></div>`;
  moveNow();

  $("#receipt").innerHTML = `<div class="rh">TAGWERK</div><div class="rh">${new Date(DAY.date+"T12:00").toLocaleDateString("de-DE")} · ${DAY.start}–${DAY.leave}</div><hr>
    <div class="rr muted"><span>AUFGABE</span><span>FERTIG</span><span>MIN</span></div>
    ${TASKS.map(x => { const d = S.done[x.i]; if (!d) return `<div class="rr muted"><span>${esc(x.t)}</span><span>··:··</span><span>—</span></div>`;
      const m = Math.round((x.end - d)/60000); return `<div class="rr"><span>${esc(x.t)}</span><span>${fmtT(d)}</span><span>${m > 0 ? "+" + m : m}</span></div>`; }).join("")}
    <hr><div class="tot"><span>ERLEDIGT</span><span>${n}/${TASKS.length}</span></div>
    <div class="tot"><span>STAND</span><span>${lead == null ? "±0" : (lead > 0 ? "+" : "") + lead} min</span></div>
    <div class="tot"><span>GESAMMELT</span><span>${S.got.length}</span></div><hr>
    <div class="rh">${n === TASKS.length ? "ALLES ERLEDIGT. VIEL ERFOLG MORGEN." : "NOCH " + (TASKS.length - n) + " OFFEN"}</div>`;

  $("#parked").innerHTML = S.parked.length ? S.parked.map((p,i) => `<button class="row ${p.d?"d":""}" data-p="${i}"><span class="c"></span><span class="n">${esc(p.t)}</span><span class="tm">${p.d?"erledigt":"später"}</span></button>`).join("")
    : `<div class="empty">Leer. Wenn dir beim Lernen was einfällt, park es mit „Gedanke parken“.</div>`;

  $("#colLbl").textContent = `Gesammelt · ${S.got.length} von ${REWARDS.length}`;
  $("#tiles").innerHTML = S.got.length ? S.got.map(i => `<div class="tile"><span class="lbl">${esc(REWARDS[i][0])}</span>${esc(REWARDS[i][1])}</div>`).join("") : `<div class="empty">Noch nichts. Nach jeder Aufgabe gibt es etwas freizurubbeln.</div>`;

  $("#list").innerHTML = TASKS.map(x => `<button class="row ${S.done[x.i]?"d":""} ${c&&c.i===x.i?"cur":""}" data-i="${x.i}"><span class="c"></span><span class="n">${esc(x.t)}</span><span class="tm mono">${x.until}</span></button>`).join("");
}
function moveNow(){ const m = $("#nowmark"); if (m) m.style.left = (Math.min(1, Math.max(0, (Date.now()-T0)/(LEAVE-T0)))*100) + "%"; }

$("#parked").onclick = e => { const b = e.target.closest("[data-p]"); if (!b) return; const p = S.parked[+b.dataset.p]; p.d = !p.d; save(); renderBelow(); };
$("#list").onclick = e => { const b = e.target.closest("[data-i]"); if (!b) return; const i = +b.dataset.i, before = cur();
  if (S.done[i]) delete S.done[i]; else S.done[i] = Date.now(); save(); renderBelow(); tone(S.done[i]?880:440,.08,.04);
  if (cur() !== before) showTask(); };

/* Fokus: zählt, wie lange du ohne App-Wechsel dran bist */
let hiddenAt = 0;
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "hidden"){ hiddenAt = Date.now(); return; }
  try{ await navigator.wakeLock.request("screen"); }catch{}
  if (hiddenAt && Date.now() - hiddenAt > 15000 && cur()){
    S.longest = Math.max(S.longest, hiddenAt - S.focusSince); S.away++; S.focusSince = Date.now(); save(); renderBelow();
    toast("Zurück. Weiter mit: " + cur().t);
  }
  hiddenAt = 0;
});

/* Rauschen: weiches braunes Rauschen zum Konzentrieren */
let noiseSrc = null, noiseGain = null;
$("#noise").onclick = () => {
  const btn = $("#noise");
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)(); AC.resume && AC.resume();
    if (noiseSrc){ const s = noiseSrc; noiseGain.gain.linearRampToValueAtTime(0, AC.currentTime + .6); setTimeout(() => s.stop(), 700); noiseSrc = null; btn.classList.remove("on"); btn.setAttribute("aria-pressed","false"); return; }
    const len = AC.sampleRate * 6, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0); let last = 0;
    for (let i=0;i<len;i++){ last = (last + .02*(Math.random()*2-1)) / 1.02; d[i] = last * 3.5; }
    const fade = 2000; for (let i=0;i<fade;i++){ const k = i/fade; d[len-fade+i] = d[len-fade+i]*(1-k) + d[i]*k; }
    noiseSrc = AC.createBufferSource(); noiseSrc.buffer = buf; noiseSrc.loop = true;
    const f = AC.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
    noiseGain = AC.createGain(); noiseGain.gain.setValueAtTime(0, AC.currentTime); noiseGain.gain.linearRampToValueAtTime(.35, AC.currentTime + 1.5);
    noiseSrc.connect(f).connect(noiseGain).connect(AC.destination); noiseSrc.start();
    btn.classList.add("on"); btn.setAttribute("aria-pressed","true");
  }catch{ toast("Ton wird hier nicht unterstützt"); }
};

/* ===== Start ===== */
$("#leave").textContent = DAY.leave;
renderClock(); renderBelow(); showTask();
setInterval(() => { renderClock(); tickTask(); moveNow(); const f = $("#focusN"); if (f) f.textContent = focusMin(); }, 1000);
setInterval(save, 20000);
addEventListener("scroll", () => { const s = scrollY > 40; document.querySelector(".more").classList.toggle("gone", s); if (s) $("#below").classList.remove("hide"); }, { passive:true });
(async () => { try{ if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch{} })();
</script>

<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
</body>
</html>
